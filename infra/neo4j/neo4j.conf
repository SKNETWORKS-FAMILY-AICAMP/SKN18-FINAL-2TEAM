##############################################
# Neo4j Configuration (Docker / Production)
##############################################

# --- 기본 데이터베이스 ---
dbms.default_database=neo4j

# --- Bolt 설정 ---
dbms.connector.bolt.enabled=true
dbms.connector.bolt.listen_address=0.0.0.0:7687
dbms.connector.bolt.advertised_address=0.0.0.0:7687

# --- HTTP / HTTPS (Browser) ---
dbms.connector.http.enabled=true
dbms.connector.http.listen_address=0.0.0.0:7474

dbms.connector.https.enabled=false
# (원하면 https 활성화 가능)

# --- 외부 접속 허용 ---
dbms.default_listen_address=0.0.0.0

# --- 메모리 설정 (EC2 t3.large 기준) ---
# Page cache는 전체 DB의 ~50% 정도 권장
dbms.memory.pagecache.size=2G

# JVM Heap - Neo4j Graph Processing 용
server.memory.heap.initial_size=1G
server.memory.heap.max_size=2G

# 필요 시 더 큰 인스턴스에서 늘릴 수 있음:
# server.memory.heap.max_size=4G

# --- 로그 설정 ---
server.logs.dir=/logs # docker-compose.prod.yml 에서 neo4j-logs 마운트
server.directories.data=/data

# --- 성능 최적화 ---
dbms.tx_log.rotation.size=20M
dbms.tx_log.rotation.retention_policy=2 days

# 쿼리 로그 활성화 (디버깅용)
db.query_log.enabled=true
db.query_log.filename=/logs/query.log
db.query_log.rotation.size=10M
db.query_log.rotation.keep_number=10

# --- Cypher 튜닝 ---
dbms.cypher.hints_enabled=true
dbms.cypher.default_language_version=5

# --- 플러그인 ---
dbms.security.procedures.unrestricted=apoc.*,gds.*
dbms.security.procedures.allowlist=apoc.*,gds.*

# --- 초기 비밀번호 자동 설정 (Docker 환경은 NEO4J_AUTH 사용) ---
# dbms.security.auth_enabled=true

# --- 기타 ---
server.bolt.tls_level=DISABLED
