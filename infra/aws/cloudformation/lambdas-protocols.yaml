AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Protocols Lambda Functions"

Parameters:
  S3BucketName:
    Type: String
    Description: "ETL 데이터 저장용 S3 버킷 이름 (Core Stack에서 전달)"

  LambdaExecutionRoleArn:
    Type: String
    Description: "Lambda 실행 역할 ARN (Core Stack에서 전달)"

  DatabaseUrl:
    Type: String
    Description: "Database 연결 URL (Core Stack에서 전달)"

  CommonLayerArn:
    Type: String
    Description: "Common Lambda Layer ARN (Core Stack에서 전달)"

  ProtocolsLayerArn:
    Type: String
    Description: "Protocols Lambda Layer ARN (Core Stack에서 전달)"

  # Parameter Store 경로 (Lambda 함수에서 직접 가져옴)
  ClientAccessTokenParameterPath:
    Type: String
    Default: "/skn18/client-access-token"
    Description: "Protocols.io Client Access Token Parameter Store 경로 (SecureString, Lambda 함수에서 직접 가져옴)"

  LambdaTimeout:
    Type: Number
    Default: 900
    Description: "Lambda 함수 타임아웃 (초, 기본값: 900)"

  LambdaMemorySize:
    Type: Number
    Default: 2048
    Description: "Lambda 함수 메모리 크기 (MB, 기본값: 2048)"

  StepFunctionsMaxConcurrency:
    Type: Number
    Default: 10
    Description: "Step Functions Map State 최대 동시 실행 수 (기본값: 10, 최대: 40)"

Resources:
  # =========================
  # Lambda 함수: Protocols ETL (키워드별)
  # =========================
  # Protocols Lambda 함수들
  ProtocolsEtlLambdaProtein:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: skn18-protocols-etl-protein
      Runtime: python3.12
      Handler: infra.aws.lambda_functions.trigger_etl.protocols.protocols_ingest_protein.lambda_handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Layers:
        - !Ref CommonLayerArn
        - !Ref ProtocolsLayerArn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          CLIENT_ACCESS_TOKEN_PARAMETER_PATH: !Ref ClientAccessTokenParameterPath
          PROTOCOL_SCHEDULE_DATABASE_URL: !Ref DatabaseUrl
      CodeUri: ../lambda_build/protocols
      Tags:
        Name: skn18-protocols-etl-protein
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        BuildCommand: &ProtocolsCommonBuild |
          # Handler 경로를 위한 __init__.py 파일 생성
          echo "[SAM BUILD] Creating __init__.py files for Handler path..."
          mkdir -p infra/aws/lambda_functions/trigger_etl/protocols
          touch infra/__init__.py
          touch infra/aws/__init__.py
          touch infra/aws/lambda_functions/__init__.py
          touch infra/aws/lambda_functions/trigger_etl/__init__.py
          touch infra/aws/lambda_functions/trigger_etl/protocols/__init__.py
          # prepare_build.sh가 이미 필요한 파일만 복사했으므로
          # 추가 정리만 수행 (캐시 파일 및 메타데이터 제거)
          echo "[SAM BUILD] Cleaning up build artifacts..."
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          find . -name "*.pyo" -delete 2>/dev/null || true
          find . -name ".DS_Store" -delete 2>/dev/null || true
          echo "[SAM BUILD] Cleanup completed."

  # Cell 키워드
  ProtocolsEtlLambdaCell:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: skn18-protocols-etl-cell
      Runtime: python3.12
      Handler: infra.aws.lambda_functions.trigger_etl.protocols.protocols_ingest_cell.lambda_handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Layers:
        - !Ref CommonLayerArn
        - !Ref ProtocolsLayerArn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          CLIENT_ACCESS_TOKEN_PARAMETER_PATH: !Ref ClientAccessTokenParameterPath
          PROTOCOL_SCHEDULE_DATABASE_URL: !Ref DatabaseUrl
      CodeUri: ../lambda_build/protocols
      Tags:
        Name: skn18-protocols-etl-cell
        Keyword: Cell
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        BuildCommand: *ProtocolsCommonBuild

  # DNA 키워드
  ProtocolsEtlLambdaDna:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: skn18-protocols-etl-dna
      Runtime: python3.12
      Handler: infra.aws.lambda_functions.trigger_etl.protocols.protocols_ingest_dna.lambda_handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Layers:
        - !Ref CommonLayerArn
        - !Ref ProtocolsLayerArn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          CLIENT_ACCESS_TOKEN_PARAMETER_PATH: !Ref ClientAccessTokenParameterPath
          PROTOCOL_SCHEDULE_DATABASE_URL: !Ref DatabaseUrl
      CodeUri: ../lambda_build/protocols
      Tags:
        Name: skn18-protocols-etl-dna
        Keyword: DNA
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        BuildCommand: *ProtocolsCommonBuild

  # RNA 키워드
  ProtocolsEtlLambdaRna:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: skn18-protocols-etl-rna
      Runtime: python3.12
      Handler: infra.aws.lambda_functions.trigger_etl.protocols.protocols_ingest_rna.lambda_handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Layers:
        - !Ref CommonLayerArn
        - !Ref ProtocolsLayerArn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          CLIENT_ACCESS_TOKEN_PARAMETER_PATH: !Ref ClientAccessTokenParameterPath
          PROTOCOL_SCHEDULE_DATABASE_URL: !Ref DatabaseUrl
      CodeUri: ../lambda_build/protocols
      Tags:
        Name: skn18-protocols-etl-rna
        Keyword: RNA
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        BuildCommand: *ProtocolsCommonBuild

  # vivo 키워드
  ProtocolsEtlLambdaVivo:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: skn18-protocols-etl-vivo
      Runtime: python3.12
      Handler: infra.aws.lambda_functions.trigger_etl.protocols.protocols_ingest_vivo.lambda_handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Layers:
        - !Ref CommonLayerArn
        - !Ref ProtocolsLayerArn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          CLIENT_ACCESS_TOKEN_PARAMETER_PATH: !Ref ClientAccessTokenParameterPath
          PROTOCOL_SCHEDULE_DATABASE_URL: !Ref DatabaseUrl
      CodeUri: ../lambda_build/protocols
      Tags:
        Name: skn18-protocols-etl-vivo
        Keyword: vivo
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        BuildCommand: *ProtocolsCommonBuild

  # mouse 키워드
  ProtocolsEtlLambdaMouse:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: skn18-protocols-etl-mouse
      Runtime: python3.12
      Handler: infra.aws.lambda_functions.trigger_etl.protocols.protocols_ingest_mouse.lambda_handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Layers:
        - !Ref CommonLayerArn
        - !Ref ProtocolsLayerArn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          CLIENT_ACCESS_TOKEN_PARAMETER_PATH: !Ref ClientAccessTokenParameterPath
          PROTOCOL_SCHEDULE_DATABASE_URL: !Ref DatabaseUrl
      CodeUri: ../lambda_build/protocols
      Tags:
        Name: skn18-protocols-etl-mouse
        Keyword: mouse
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        BuildCommand: *ProtocolsCommonBuild

  # Protocols Cleansing + Chunking Lambda
  ProtocolsCleanseChunkLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: skn18-protocols-cleanse-chunk
      Runtime: python3.12
      Handler: infra.aws.lambda_functions.trigger_etl.protocols.protocols_cleanse_chunk.lambda_handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: !Ref LambdaTimeout
      MemorySize: 5120  # Cleansing + Chunking은 메모리 사용량이 많음
      Layers:
        - !Ref CommonLayerArn
        - !Ref ProtocolsLayerArn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
      CodeUri: ../lambda_build/protocols
      Tags:
        Name: skn18-protocols-cleanse-chunk
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        BuildCommand: *ProtocolsCommonBuild

  # Protocols Embedding Lambda (단일 파일 처리용)
  ProtocolsEmbedLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: skn18-protocols-embed
      Runtime: python3.12
      Handler: infra.aws.lambda_functions.trigger_etl.protocols.protocols_embed.lambda_handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 900  # 15분 (최대)
      MemorySize: 3008  # Embedding은 메모리 사용량이 많음
      Layers:
        - !Ref CommonLayerArn
        - !Ref ProtocolsLayerArn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          OPENAI_API_KEY_PARAMETER_PATH: "/skn18/openai-api-key"
      CodeUri: ../lambda_build/protocols
      Tags:
        Name: skn18-protocols-embed
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        BuildCommand: *ProtocolsCommonBuild

  # Protocols Chunk File List Lambda (S3에서 분할 파일 목록 조회)
  ProtocolsChunkFileListLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: skn18-protocols-chunk-file-list
      Runtime: python3.12
      Handler: infra.aws.lambda_functions.trigger_etl.protocols.protocols_chunk_file_list.lambda_handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 60
      MemorySize: 256
      Layers:
        - !Ref CommonLayerArn
        - !Ref ProtocolsLayerArn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
      CodeUri: ../lambda_build/protocols
      Tags:
        Name: skn18-protocols-chunk-file-list
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        BuildCommand: *ProtocolsCommonBuild

  # =========================
  # EventBridge 규칙: Protocols (키워드별)
  # =========================
  # Protein 키워드 스케줄 (매 시간 정각마다 실행: 0시, 1시, 2시...)
  ProtocolsEtlScheduleRuleProtein:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-protocols-etl-protein-schedule
      Description: "Protocols ETL 실행 스케줄 - Protein 키워드 (매 시간 정각마다: 0시, 1시, 2시...)"
      ScheduleExpression: "cron(0 * * * ? *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsEtlLambdaProtein.Arn
          Id: "ProtocolsProteinTarget"
          Input: !Sub |
            {
              "keyword": "Protein",
              "raw_dir": "data/raw"
            }

  # Cell 키워드 스케줄 (매 시간 정각마다 실행: 0시, 1시, 2시...)
  ProtocolsEtlScheduleRuleCell:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-protocols-etl-cell-schedule
      Description: "Protocols ETL 실행 스케줄 - Cell 키워드 (매 시간 정각마다: 0시, 1시, 2시...)"
      ScheduleExpression: "cron(0 * * * ? *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsEtlLambdaCell.Arn
          Id: "ProtocolsCellTarget"
          Input: !Sub |
            {
              "keyword": "Cell",
              "raw_dir": "data/raw"
            }

  # DNA 키워드 스케줄 (매 시간 정각마다 실행: 0시, 1시, 2시...)
  ProtocolsEtlScheduleRuleDna:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-protocols-etl-dna-schedule
      Description: "Protocols ETL 실행 스케줄 - DNA 키워드 (매 시간 정각마다: 0시, 1시, 2시...)"
      ScheduleExpression: "cron(0 * * * ? *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsEtlLambdaDna.Arn
          Id: "ProtocolsDnaTarget"
          Input: !Sub |
            {
              "keyword": "DNA",
              "raw_dir": "data/raw"
            }

  # RNA 키워드 스케줄 (매 시간 정각마다 실행: 0시, 1시, 2시...)
  ProtocolsEtlScheduleRuleRna:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-protocols-etl-rna-schedule
      Description: "Protocols ETL 실행 스케줄 - RNA 키워드 (매 시간 정각마다: 0시, 1시, 2시...)"
      ScheduleExpression: "cron(0 * * * ? *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsEtlLambdaRna.Arn
          Id: "ProtocolsRnaTarget"
          Input: !Sub |
            {
              "keyword": "RNA",
              "raw_dir": "data/raw"
            }

  # vivo 키워드 스케줄 (매 시간 정각마다 실행: 0시, 1시, 2시...)
  ProtocolsEtlScheduleRuleVivo:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-protocols-etl-vivo-schedule
      Description: "Protocols ETL 실행 스케줄 - vivo 키워드 (매 시간 정각마다: 0시, 1시, 2시...)"
      ScheduleExpression: "cron(0 * * * ? *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsEtlLambdaVivo.Arn
          Id: "ProtocolsVivoTarget"
          Input: !Sub |
            {
              "keyword": "vivo",
              "raw_dir": "data/raw"
            }

  # mouse 키워드 스케줄 (매 시간 정각마다 실행: 0시, 1시, 2시...)
  ProtocolsEtlScheduleRuleMouse:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-protocols-etl-mouse-schedule
      Description: "Protocols ETL 실행 스케줄 - mouse 키워드 (매 시간 정각마다: 0시, 1시, 2시...)"
      ScheduleExpression: "cron(0 * * * ? *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsEtlLambdaMouse.Arn
          Id: "ProtocolsMouseTarget"
          Input: !Sub |
            {
              "keyword": "mouse",
              "raw_dir": "data/raw"
            }

  # =========================
  # Lambda 권한: EventBridge에서 Lambda 호출 허용
  # =========================
  # Protocols 키워드별 권한
  ProtocolsLambdaPermissionProtein:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsEtlLambdaProtein
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  ProtocolsLambdaPermissionCell:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsEtlLambdaCell
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  ProtocolsLambdaPermissionDna:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsEtlLambdaDna
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  ProtocolsLambdaPermissionRna:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsEtlLambdaRna
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  ProtocolsLambdaPermissionVivo:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsEtlLambdaVivo
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  ProtocolsLambdaPermissionMouse:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsEtlLambdaMouse
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  ProtocolsCleanseChunkLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsCleanseChunkLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  # =========================
  # EventBridge 규칙: Protocols Cleansing + Chunking (하루에 한 번)
  # =========================
  ProtocolsCleanseChunkScheduleRule:
    Type: AWS::Events::Rule
    DependsOn:
      - ProtocolsCleanseChunkLambda
      - ProtocolsCleanseChunkLambdaPermission
    Properties:
      Name: skn18-protocols-cleanse-chunk-schedule
      Description: "Protocols Cleansing + Chunking 실행 스케줄 (하루에 한 번, 매일 02:00 UTC)"
      ScheduleExpression: "cron(0 2 * * ? *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsCleanseChunkLambda.Arn
          Id: "ProtocolsCleanseChunkTarget"

  ProtocolsEmbedLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsEmbedLambda
      Action: lambda:InvokeFunction
      Principal: states.amazonaws.com

  ProtocolsChunkFileListLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsChunkFileListLambda
      Action: lambda:InvokeFunction
      Principal: states.amazonaws.com

  # =========================
  # Step Functions IAM 역할
  # =========================
  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsLambdaInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ProtocolsChunkFileListLambda.Arn
                  - !GetAtt ProtocolsEmbedLambda.Arn
        - PolicyName: StepFunctionsS3AccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}"
                  - !Sub "arn:aws:s3:::${S3BucketName}/*"

  # =========================
  # Step Functions: Protocols Embedding (병렬 처리)
  # =========================
  ProtocolsEmbedStepFunction:
    Type: AWS::StepFunctions::StateMachine
    DependsOn:
      - ProtocolsChunkFileListLambda
      - ProtocolsEmbedLambda
      - StepFunctionsExecutionRole
    Properties:
      StateMachineName: skn18-protocols-embed-parallel
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionString: !Sub
        - |
          {
            "Comment": "Protocols Embedding - 병렬 처리 (최대 ${MaxConcurrency}개 동시 실행)",
            "StartAt": "ListChunkFiles",
            "States": {
            "ListChunkFiles": {
              "Type": "Task",
              "Resource": "${ProtocolsChunkFileListLambdaArn}",
              "ResultPath": "$.chunkFiles",
              "Next": "CheckFiles"
            },
              "CheckFiles": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.chunkFiles.files",
                    "IsPresent": true,
                    "Next": "ProcessFiles"
                  }
                ],
                "Default": "NoFiles"
              },
              "ProcessFiles": {
                "Type": "Map",
                "ItemsPath": "$.chunkFiles.files",
                "MaxConcurrency": ${MaxConcurrency},
                "Iterator": {
                  "StartAt": "EmbedChunkFile",
                  "States": {
                    "EmbedChunkFile": {
                      "Type": "Task",
                      "Resource": "${ProtocolsEmbedLambdaArn}",
                      "Parameters": {
                        "chunks_dir": "data/chunks",
                        "embeddings_dir": "data/embeddings",
                        "s3_chunks_prefix": "data/chunks/protocols",
                        "s3_embeddings_prefix": "data/embeddings/protocols",
                        "chunk_file": "$.s3_key",
                        "keyword": "$.keyword",
                        "date_time": "$.date_time"
                      },
                      "Retry": [
                        {
                          "ErrorEquals": ["States.ALL"],
                          "IntervalSeconds": 2,
                          "MaxAttempts": 3,
                          "BackoffRate": 2.0
                        }
                      ],
                      "End": true
                    }
                  }
                },
                "ResultPath": "$.results",
                "End": true
              },
              "NoFiles": {
                "Type": "Pass",
                "Result": "No chunk files found",
                "End": true
              }
            }
          }
        - ProtocolsChunkFileListLambdaArn: !GetAtt ProtocolsChunkFileListLambda.Arn
          ProtocolsEmbedLambdaArn: !GetAtt ProtocolsEmbedLambda.Arn
          MaxConcurrency: !Ref StepFunctionsMaxConcurrency

  # =========================
  # EventBridge Step Function 실행 역할 (embed step function 스케줄용)
  # =========================
  EventBridgeStepFunctionRole:
    Type: AWS::IAM::Role
    DependsOn:
      - ProtocolsEmbedStepFunction
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EventBridgeStepFunctionExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !GetAtt ProtocolsEmbedStepFunction.Arn

  # =========================
  # EventBridge 규칙: Protocols Embedding Step Function (하루에 한 번)
  # =========================
  ProtocolsEmbedStepFunctionScheduleRule:
    Type: AWS::Events::Rule
    DependsOn:
      - ProtocolsEmbedStepFunction
      - EventBridgeStepFunctionRole
    Properties:
      Name: skn18-protocols-embed-schedule
      Description: "Protocols Embedding Step Function 실행 스케줄 (하루에 한 번, 매일 04:00 UTC)"
      ScheduleExpression: "cron(0 4 * * ? *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsEmbedStepFunction.Arn
          Id: "ProtocolsEmbedStepFunctionTarget"
          RoleArn: !GetAtt EventBridgeStepFunctionRole.Arn

Outputs:
  ProtocolsLambdaArnProtein:
    Description: "Protocols ETL Lambda 함수 ARN (Protein)"
    Value: !GetAtt ProtocolsEtlLambdaProtein.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProtocolsLambdaArnProtein"

  ProtocolsLambdaArnCell:
    Description: "Protocols ETL Lambda 함수 ARN (Cell)"
    Value: !GetAtt ProtocolsEtlLambdaCell.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProtocolsLambdaArnCell"

  ProtocolsLambdaArnDna:
    Description: "Protocols ETL Lambda 함수 ARN (DNA)"
    Value: !GetAtt ProtocolsEtlLambdaDna.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProtocolsLambdaArnDna"

  ProtocolsLambdaArnRna:
    Description: "Protocols ETL Lambda 함수 ARN (RNA)"
    Value: !GetAtt ProtocolsEtlLambdaRna.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProtocolsLambdaArnRna"

  ProtocolsLambdaArnVivo:
    Description: "Protocols ETL Lambda 함수 ARN (vivo)"
    Value: !GetAtt ProtocolsEtlLambdaVivo.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProtocolsLambdaArnVivo"

  ProtocolsLambdaArnMouse:
    Description: "Protocols ETL Lambda 함수 ARN (mouse)"
    Value: !GetAtt ProtocolsEtlLambdaMouse.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProtocolsLambdaArnMouse"

  ProtocolsCleanseChunkLambdaArn:
    Description: "Protocols Cleansing + Chunking Lambda 함수 ARN"
    Value: !GetAtt ProtocolsCleanseChunkLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProtocolsCleanseChunkLambdaArn"

  ProtocolsEmbedLambdaArn:
