AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "RabbitMQ EC2 Infrastructure - VPC, Security Group, EC2 Instance"

Parameters:
  # Parameter Store에서 값을 읽어오는 파라미터들
  KeyName:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/skn18/key-name"
    Description: "EC2 SSH KeyPair 이름 (Parameter Store: /skn18/key-name)"

  InstanceType:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/skn18/rabbitmq-instance-type"
    Description: "RabbitMQ EC2 인스턴스 타입 (Parameter Store: /skn18/rabbitmq-instance-type, 예: t3.medium)"

  AllowedCidr:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/skn18/allowed-cidr"
    Description: "RabbitMQ에 접근 가능한 CIDR (Parameter Store: /skn18/allowed-cidr)"

  RabbitMQAmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/skn18/rabbitmq-ami-id"
    Description: "AMI ID for RabbitMQ EC2 instance (Packer로 빌드된 AMI ID를 Parameter Store에 저장 필요: /skn18/rabbitmq-ami-id)"

  VpcId:
    Type: "String"
    Description: "Existing VPC ID (optional, leave empty to create new VPC)"
    Default: ""

  SubnetId:
    Type: "String"
    Description: "Existing Subnet ID (required if VpcId is provided, leave empty if creating new VPC)"
    Default: ""

Conditions:
  CreateVPC:
    Fn::Equals:
      - !Ref VpcId
      - ""

Resources:
  # =========================
  # 네트워크 (VPC - 기존 VPC 사용 또는 새로 생성)
  # =========================
  AppVPC:
    Type: AWS::EC2::VPC
    Condition: CreateVPC
    Properties:
      CidrBlock: "10.2.0.0/16"
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: "skn18-rabbitmq-vpc"

  AppInternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVPC
    Properties:
      Tags:
        - Key: Name
          Value: "skn18-rabbitmq-igw"

  AppVpcIgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVPC
    Properties:
      VpcId: !Ref AppVPC
      InternetGatewayId: !Ref AppInternetGateway

  AppPublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVPC
    Properties:
      VpcId: !Ref AppVPC
      CidrBlock: "10.2.1.0/24"
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: "skn18-rabbitmq-public-subnet"

  AppPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVPC
    Properties:
      VpcId: !Ref AppVPC
      Tags:
        - Key: Name
          Value: "skn18-rabbitmq-public-rt"

  AppPublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateVPC
    DependsOn: AppVpcIgwAttachment
    Properties:
      RouteTableId: !Ref AppPublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref AppInternetGateway

  AppPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVPC
    Properties:
      SubnetId: !Ref AppPublicSubnet
      RouteTableId: !Ref AppPublicRouteTable

  # =========================
  # 보안 그룹
  # =========================
  RabbitMQSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for RabbitMQ EC2"
      VpcId: !If [CreateVPC, !Ref AppVPC, !Ref VpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5672
          ToPort: 5672
          CidrIp: !Ref AllowedCidr
          Description: "RabbitMQ AMQP"
        - IpProtocol: tcp
          FromPort: 15672
          ToPort: 15672
          CidrIp: !Ref AllowedCidr
          Description: "RabbitMQ Management UI"
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCidr
          Description: "SSH"
      Tags:
        - Key: Name
          Value: "skn18-rabbitmq-sg"

  # =========================
  # EC2 인스턴스
  # =========================
  RabbitMQInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref RabbitMQAmiId
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref Ec2InstanceProfile
      SubnetId: !If 
        - CreateVPC
        - !Ref AppPublicSubnet
        - !Ref SubnetId
      SecurityGroupIds:
        - !Ref RabbitMQSecurityGroup
      Tags:
        - Key: Name
          Value: "skn18-rabbitmq-ec2"
      BlockDeviceMappings:
        - DeviceName: "/dev/xvda"
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -xe

          # ========================================
          # AMI에 이미 포함된 설정:
          # - Docker 설치 및 설정 완료
          # - ec2-user가 docker 그룹에 추가됨
          # - /var/lib/rabbitmq 디렉토리 준비됨
          # - /var/log/rabbitmq 디렉토리 준비됨
          # ========================================

          # ---------
          # Docker 서비스 시작 (AMI에 설치되어 있지만 중지 상태)
          # ---------
          systemctl start docker
          systemctl enable docker

          # ---------
          # 기존 컨테이너 정리 (재시작 시 중복 방지)
          # ---------
          docker stop rabbitmq-final || true
          docker rm -f rabbitmq-final || true

          # ---------
          # RabbitMQ 데이터 디렉토리 최종 확인
          # ---------
          mkdir -p /var/lib/rabbitmq /var/log/rabbitmq
          chown -R ec2-user:ec2-user /var/lib/rabbitmq
          chown -R ec2-user:ec2-user /var/log/rabbitmq

          # ---------
          # Parameter Store에서 RabbitMQ 사용자명과 비밀번호 가져오기
          # ---------
          REGION=$(curl -s --max-time 5 http://169.254.169.254/latest/meta-data/placement/region 2>/dev/null)
          if [ -z "$REGION" ]; then
            REGION="ap-northeast-2"
          fi
          echo "Using region: $REGION"
          
          RABBITMQ_USER=$(aws ssm get-parameter --name /skn18/rabbitmq-user --region "$REGION" --query 'Parameter.Value' --output text 2>&1)
          if [ $? -ne 0 ] || [ -z "$RABBITMQ_USER" ]; then
            echo "WARNING: Failed to retrieve RabbitMQ user from Parameter Store, using default"
            RABBITMQ_USER="guest"
          else
            echo "RabbitMQ user retrieved successfully from Parameter Store"
          fi
          
          RABBITMQ_PASSWORD=$(aws ssm get-parameter --name /skn18/rabbitmq-password --with-decryption --region "$REGION" --query 'Parameter.Value' --output text 2>&1)
          if [ $? -ne 0 ] || [ -z "$RABBITMQ_PASSWORD" ]; then
            echo "ERROR: Failed to retrieve RabbitMQ password from Parameter Store"
            echo "Error details: $RABBITMQ_PASSWORD"
            # 임시로 기본값 사용 (디버깅용)
            RABBITMQ_PASSWORD="guest"
            echo "Using fallback password for debugging"
          else
            echo "RabbitMQ password retrieved successfully from Parameter Store"
          fi

          # ---------
          # Docker 컨테이너 실행 (rabbitmq:3.13-management-alpine)
          # ---------
          docker run -d \
            --name rabbitmq-final \
            -e RABBITMQ_DEFAULT_USER="$RABBITMQ_USER" \
            -e RABBITMQ_DEFAULT_PASS="$RABBITMQ_PASSWORD" \
            -p 5672:5672 \
            -p 15672:15672 \
            -v /var/lib/rabbitmq:/var/lib/rabbitmq \
            -v /var/log/rabbitmq:/var/log/rabbitmq \
            --restart unless-stopped \
            --health-cmd "rabbitmq-diagnostics ping" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=5 \
            --health-start-period=30s \
            rabbitmq:3.13-management-alpine

          echo "=== RabbitMQ Docker container started successfully ==="

  # =========================
  # EC2 IAM 역할 (Parameter Store 접근용)
  # =========================
  Ec2ParameterStoreRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ParameterStoreAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/skn18/*"

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2ParameterStoreRole

Outputs:
  InstanceId:
    Description: "RabbitMQ EC2 Instance ID"
    Value: !Ref RabbitMQInstance
    Export:
      Name: !Sub "${AWS::StackName}-RabbitMQInstanceId"

  PublicIp:
    Description: "RabbitMQ EC2 Public IP"
    Value: !GetAtt RabbitMQInstance.PublicIp
    Export:
      Name: !Sub "${AWS::StackName}-RabbitMQPublicIp"

  AmqpEndpoint:
    Description: "RabbitMQ AMQP 접속 엔드포인트"
    Value: !Sub "${RabbitMQInstance.PublicIp}:5672"
    Export:
      Name: !Sub "${AWS::StackName}-RabbitMQAmqpEndpoint"

  ManagementUiEndpoint:
    Description: "RabbitMQ Management UI 접속 엔드포인트"
    Value: !Sub "http://${RabbitMQInstance.PublicIp}:15672"
    Export:
      Name: !Sub "${AWS::StackName}-RabbitMQManagementUiEndpoint"

  ConnectionStringExample:
    Description: "RabbitMQ 접속 예시 (사용자명과 비밀번호는 Parameter Store에서 확인: /skn18/rabbitmq-user, /skn18/rabbitmq-password)"
    Value: !Sub "amqp://[USER]:[PASSWORD]@${RabbitMQInstance.PublicIp}:5672/"
    Export:
      Name: !Sub "${AWS::StackName}-RabbitMQConnectionStringExample"

  VpcId:
    Description: "사용된 VPC ID"
    Value: !If [CreateVPC, !Ref AppVPC, !Ref VpcId]
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  SecurityGroupId:
    Description: "Security Group ID"
    Value: !Ref RabbitMQSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-RabbitMQSecurityGroupId"

