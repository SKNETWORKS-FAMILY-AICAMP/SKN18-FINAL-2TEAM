          S3_BUCKET_NAME: !Ref S3BucketName
          CLIENT_ACCESS_TOKEN: !Ref ClientAccessToken
          PROTOCOL_SCHEDULE_DATABASE_URL: !Sub "postgresql://${PostgresUser}:${PostgresPassword}@${PgVectorInstance.PublicIp}:${PostgresPort}/${PostgresDbName}"
      CodeUri: ../lambda_build/protocols/  # 변경: lambda_build 디렉토리 사용
      Tags:
        Name: skn18-protocols-etl-cell
        Keyword: Cell
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        BuildCommand: |
          # 불필요한 패키지 제거 (이미 필요한 파일만 포함되어 있음)
          rm -rf torch transformers sentence_transformers accelerate tokenizers safetensors || true
          rm -rf scipy pandas numpy nltk nltk_data django langchain langgraph neo4j sqlalchemy pillow zstandard aiohttp openai langchain_classic || true
          rm -rf .history || true
          # Lambda 전용 패키지 설치
          pip install --upgrade --force-reinstall -r requirements-lambda-protocols.txt -t .

