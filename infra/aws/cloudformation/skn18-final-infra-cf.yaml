AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "SKN18-final - EC2 + Docker(pgvector/postgresql) + Lambda ETL with EventBridge"

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: "EC2 SSH KeyPair 이름 (예: my-keypair)"

  InstanceType:
    Type: String
    Default: "t3.medium"
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
    Description: "EC2 인스턴스 타입"

  AllowedCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "DB에 접근 가능한 CIDR (개발용: 0.0.0.0/0, 실제론 내 IP로 제한 권장)"

  PostgresDbName:
    Type: String
    Default: "sknfinaldb"

  PostgresUser:
    Type: String
    Default: "root"

  PostgresPassword:
    Type: String
    NoEcho: true
    Default: "s18f2t!@#"
    Description: "프로덕션에서는 반드시 강한 비밀번호로 변경"

  PostgresPort:
    Type: Number
    Default: 5432

  LatestAmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"

  # Lambda 관련 파라미터
  S3BucketName:
    Type: String
    Description: "ETL 데이터 저장용 S3 버킷 이름 (예: skn18-etl-data)"
    Default: "skn18-etl-data"

  LambdaCodeS3Bucket:
    Type: String
    Description: "Lambda 함수 코드가 업로드된 S3 버킷 이름"
    Default: ""

  LambdaCodeS3Key:
    Type: String
    Description: "Lambda 함수 코드 ZIP 파일의 S3 키 (예: lambda-functions/etl-code.zip)"
    Default: ""

  LambdaTimeout:
    Type: Number
    Default: 900
    Description: "Lambda 함수 타임아웃 (초, 최대 900초)"

  LambdaMemorySize:
    Type: Number
    Default: 1024
    Description: "Lambda 함수 메모리 크기 (MB)"

  OpenAiApiKey:
    Type: String
    NoEcho: true
    Description: "OpenAI API Key (Lambda embedding에 필요)"
    Default: ""

  ClientAccessToken:
    Type: String
    NoEcho: true
    Description: "Protocols.io Client Access Token"
    Default: ""

Resources:
  # =========================
  # 네트워크 (VPC 자동 생성)
  # =========================
  AppVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: "10.0.0.0/16"
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: "skn18-vpc"

  AppInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: "skn18-igw"

  AppVpcIgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref AppVPC
      InternetGatewayId: !Ref AppInternetGateway

  AppPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVPC
      CidrBlock: "10.0.1.0/24"
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: "skn18-public-subnet"

  AppPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AppVPC
      Tags:
        - Key: Name
          Value: "skn18-public-rt"

  AppPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AppVpcIgwAttachment
    Properties:
      RouteTableId: !Ref AppPublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref AppInternetGateway

  AppPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppPublicSubnet
      RouteTableId: !Ref AppPublicRouteTable

  # =========================
  # S3 버킷 (ETL 데이터 저장소)
  # =========================
  EtlDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: "skn18-etl-data"

  # =========================
  # 보안 그룹
  # =========================
  PgVectorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for pgvector EC2"
      VpcId: !Ref AppVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref PostgresPort
          ToPort: !Ref PostgresPort
          CidrIp: !Ref AllowedCidr
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCidr
      Tags:
        - Key: Name
          Value: "skn18-pgvector-sg"

  # =========================
  # EC2 인스턴스
  # =========================
  PgVectorInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      SubnetId: !Ref AppPublicSubnet
      SecurityGroupIds:
        - !Ref PgVectorSecurityGroup
      Tags:
        - Key: Name
          Value: "skn18-pgvector-ec2"
      BlockDeviceMappings:
        - DeviceName: "/dev/xvda"
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -xe

          # ---------
          # 기본 업데이트 + Docker 설치
          # ---------
          dnf update -y
          dnf install -y docker

          systemctl enable docker
          systemctl start docker

          # ec2-user를 docker 그룹에 추가 (SSH 접속 후 sudo 없이 docker 사용 가능)
          usermod -aG docker ec2-user

          # ---------
          # PostgreSQL 데이터 디렉토리 준비
          # PostgreSQL 18+는 /var/lib/postgresql에 마운트하면
          # 자동으로 버전별 디렉토리(예: /var/lib/postgresql/18)를 생성합니다
          # 기존 /var/lib/postgresql/data 디렉토리가 있으면 충돌하므로 정리 필요
          # ---------
          # 기존 컨테이너 정리 (데이터 정리 전에 먼저 중지)
          docker stop pg-db-final || true
          docker rm -f pg-db-final || true
          
          # PostgreSQL 18+ 호환을 위해 기존 데이터 디렉토리 정리
          # /var/lib/postgresql/data가 있으면 제거 (18+ 형식과 충돌)
          if [ -d /var/lib/postgresql/data ]; then
            echo "기존 PostgreSQL 데이터 디렉토리 발견, 백업 후 제거..."
            # 백업 (선택사항)
            mv /var/lib/postgresql/data /var/lib/postgresql/data.backup.$(date +%Y%m%d_%H%M%S) || true
          fi
          
          # PostgreSQL 18+ 형식에 맞게 디렉토리 준비
          mkdir -p /var/lib/postgresql
          chown ec2-user:ec2-user /var/lib/postgresql

          # ---------
          # init.sql 생성
          # docker-compose의 ./infra/db/init.sql 내용을 여기로 가져오는 역할
          # ---------
          cat << 'EOF' > /home/ec2-user/init.sql
          -- init.sql for pgvector
          CREATE EXTENSION IF NOT EXISTS vector;

          CREATE TABLE IF NOT EXISTS tb_vector (
              id BIGSERIAL PRIMARY KEY,
              content TEXT NOT NULL,
              embedding vector(1536),
              metadata JSONB NOT NULL
          );
          EOF

          chown ec2-user:ec2-user /home/ec2-user/init.sql

          # ---------
          # Docker 컨테이너 실행
          # + healthcheck 추가
          # ---------
          docker run -d \
            --name pg-db-final \
            -e POSTGRES_DB=${PostgresDbName} \
            -e POSTGRES_USER=${PostgresUser} \
            -e POSTGRES_PASSWORD=${PostgresPassword} \
            -p ${PostgresPort}:5432 \
            -v /var/lib/postgresql:/var/lib/postgresql \
            -v /home/ec2-user/init.sql:/docker-entrypoint-initdb.d/init.sql \
            --restart unless-stopped \
            --health-cmd "pg_isready -d ${PostgresDbName} -U ${PostgresUser}" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=5 \
            --health-start-period=10s \
            pgvector/pgvector:pg18

  # =========================
  # Lambda IAM 역할
  # =========================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: skn18-lambda-etl-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # 객체 작업 (GetObject, PutObject, DeleteObject)
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/*"
              # 버킷 작업 (ListBucket)
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${S3BucketName}"
        # Lambda 호출 권한 추가 (필수)
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  # !GetAtt 제거 - 순환 의존성 해결
                  # - !GetAtt NihCleanseChunkLambda.Arn  # 이 줄 제거
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:skn18-nih-cleanse-chunk"
                  # 필요시 다른 Lambda 함수들도 추가 가능
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:skn18-nih-ingest"

  # =========================
  # Lambda 함수: Protocols ETL (키워드별)
  # =========================
  # Protocols Lambda 함수들
  ProtocolsEtlLambdaProtein:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: skn18-protocols-etl-protein
      Runtime: python3.12
      Handler: infra.aws.lambda_functions.trigger_etl.protocols.protocols_ingest_protein.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          CLIENT_ACCESS_TOKEN: !Ref ClientAccessToken
          PROTOCOL_SCHEDULE_DATABASE_URL: !Sub "postgresql://${PostgresUser}:${PostgresPassword}@${PgVectorInstance.PublicIp}:${PostgresPort}/${PostgresDbName}"
      CodeUri: ../lambda_build/protocols/
      Tags:
        Name: skn18-protocols-etl-protein
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        BuildCommand: |
          # Lambda 기본 제공 패키지 제거 (boto3, botocore, s3transfer)
          rm -rf boto3 botocore s3transfer boto3-*.dist-info botocore-*.dist-info s3transfer-*.dist-info || true
          # 불필요한 패키지 제거
          rm -rf nltk aiohttp openai langchain_classic .history || true
          # Lambda 전용 패키지 설치
          pip install --upgrade --force-reinstall -r requirements-lambda-protocols.txt -t .

  # Cell 키워드
  ProtocolsEtlLambdaCell:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: skn18-protocols-etl-cell
      Runtime: python3.12
      Handler: infra.aws.lambda_functions.trigger_etl.protocols.protocols_ingest_cell.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
