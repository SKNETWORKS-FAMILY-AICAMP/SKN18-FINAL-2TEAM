AWSTemplateFormatVersion: "2010-09-09"
Description: "SKN18-final - Main Stack with Nested Stacks"

# Parameters는 core-infra.yaml에서 직접 Parameter Store를 참조하므로 여기서는 불필요합니다
# 필요시 여기에 추가 파라미터를 정의할 수 있습니다
Parameters: {}

Resources:
  # =========================
  # Core Infrastructure Stack
  # =========================
  CoreInfraStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: core-infra.yaml
      # Parameters는 core-infra.yaml에서 직접 Parameter Store를 참조하므로 전달 불필요

  # =========================
  # Protocols Lambda Stack
  # =========================
  ProtocolsLambdaStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: CoreInfraStack
    Properties:
      TemplateURL: lambdas-protocols.yaml
      Parameters:
        S3BucketName: !GetAtt CoreInfraStack.Outputs.EtlDataBucketName
        LambdaExecutionRoleArn: !GetAtt CoreInfraStack.Outputs.LambdaExecutionRoleArn
        DatabaseUrl: !GetAtt CoreInfraStack.Outputs.DatabaseUrl
        CommonLayerArn: !GetAtt CoreInfraStack.Outputs.CommonLayerArn
        ProtocolsLayerArn: !GetAtt CoreInfraStack.Outputs.ProtocolsLayerArn

  # =========================
  # NIH Lambda Stack
  # =========================
  NihLambdaStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: CoreInfraStack
    Properties:
      TemplateURL: lambdas-nih.yaml
      Parameters:
        S3BucketName: !GetAtt CoreInfraStack.Outputs.EtlDataBucketName
        LambdaExecutionRoleArn: !GetAtt CoreInfraStack.Outputs.LambdaExecutionRoleArn
        CommonLayerArn: !GetAtt CoreInfraStack.Outputs.CommonLayerArn
        NihLayerArn: !GetAtt CoreInfraStack.Outputs.NihLayerArn

  # =========================
  # Neo4j Infrastructure Stack
  # =========================
  Neo4jInfraStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: neo4j-infra.yaml
      Parameters:
        # neo4j-infra.yaml에서 Parameter Store를 직접 참조하므로 파라미터 전달 불필요
        # VpcId를 CoreInfraStack의 VPC를 사용하려면 아래처럼 전달 가능 (선택사항)
        VpcId: !GetAtt CoreInfraStack.Outputs.VpcId
        SubnetId: !GetAtt CoreInfraStack.Outputs.SubnetId

  # =========================
  # App Infrastructure Stack (Django + Graph + RAG)
  # =========================
  AppInfraStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: CoreInfraStack
    Properties:
      TemplateURL: app-infra.yaml
      Parameters:
        VpcId: !GetAtt CoreInfraStack.Outputs.VpcId
        SubnetId: !GetAtt CoreInfraStack.Outputs.SubnetId
        SubnetId2: !GetAtt CoreInfraStack.Outputs.SubnetId2
        # 나머지 파라미터는 app-infra.yaml에서 Parameter Store를 직접 참조

Outputs:
  # Core Infrastructure Outputs
  InstanceId:
    Description: "EC2 Instance ID"
    Value: !GetAtt CoreInfraStack.Outputs.InstanceId

  PublicIp:
    Description: "EC2 Public IP"
    Value: !GetAtt CoreInfraStack.Outputs.PublicIp

  DbEndpoint:
    Description: "DB 접속 엔드포인트 (host:port)"
    Value: !GetAtt CoreInfraStack.Outputs.DbEndpoint

  ConnectionStringExample:
    Description: "psql 접속 예시"
    Value: !GetAtt CoreInfraStack.Outputs.ConnectionStringExample

  DatabaseUrl:
    Description: "DATABASE_URL (애플리케이션에서 바로 사용 가능)"
    Value: !GetAtt CoreInfraStack.Outputs.DatabaseUrl

  VpcId:
    Description: "생성된 VPC ID"
    Value: !GetAtt CoreInfraStack.Outputs.VpcId

  SubnetId:
    Description: "생성된 Public Subnet ID"
    Value: !GetAtt CoreInfraStack.Outputs.SubnetId

  EtlDataBucketName:
    Description: "ETL 데이터 저장용 S3 버킷 이름"
    Value: !GetAtt CoreInfraStack.Outputs.EtlDataBucketName

  # Protocols Lambda Outputs
  ProtocolsLambdaArnProtein:
    Description: "Protocols ETL Lambda 함수 ARN (Protein)"
    Value: !GetAtt ProtocolsLambdaStack.Outputs.ProtocolsLambdaArnProtein

  ProtocolsLambdaArnCell:
    Description: "Protocols ETL Lambda 함수 ARN (Cell)"
    Value: !GetAtt ProtocolsLambdaStack.Outputs.ProtocolsLambdaArnCell

  ProtocolsLambdaArnDna:
    Description: "Protocols ETL Lambda 함수 ARN (DNA)"
    Value: !GetAtt ProtocolsLambdaStack.Outputs.ProtocolsLambdaArnDna

  ProtocolsLambdaArnRna:
    Description: "Protocols ETL Lambda 함수 ARN (RNA)"
    Value: !GetAtt ProtocolsLambdaStack.Outputs.ProtocolsLambdaArnRna

  ProtocolsLambdaArnVivo:
    Description: "Protocols ETL Lambda 함수 ARN (vivo)"
    Value: !GetAtt ProtocolsLambdaStack.Outputs.ProtocolsLambdaArnVivo

  ProtocolsLambdaArnMouse:
    Description: "Protocols ETL Lambda 함수 ARN (mouse)"
    Value: !GetAtt ProtocolsLambdaStack.Outputs.ProtocolsLambdaArnMouse

  ProtocolsCleanseChunkLambdaArn:
    Description: "Protocols Cleansing + Chunking Lambda 함수 ARN"
    Value: !GetAtt ProtocolsLambdaStack.Outputs.ProtocolsCleanseChunkLambdaArn

  # NIH Lambda Outputs
  NihIngestLambdaArn:
    Description: "NIH Ingest Lambda 함수 ARN"
    Value: !GetAtt NihLambdaStack.Outputs.NihIngestLambdaArn

  NihCleanseChunkLambdaArn:
    Description: "NIH Cleansing + Chunking Lambda 함수 ARN"
    Value: !GetAtt NihLambdaStack.Outputs.NihCleanseChunkLambdaArn

  # Neo4j Infrastructure Outputs
  Neo4jInstanceId:
    Description: "Neo4j EC2 Instance ID"
    Value: !GetAtt Neo4jInfraStack.Outputs.InstanceId

  Neo4jPublicIp:
    Description: "Neo4j EC2 Public IP"
    Value: !GetAtt Neo4jInfraStack.Outputs.PublicIp

  Neo4jHttpEndpoint:
    Description: "Neo4j HTTP 접속 엔드포인트"
    Value: !GetAtt Neo4jInfraStack.Outputs.HttpEndpoint

  Neo4jBoltEndpoint:
    Description: "Neo4j Bolt 접속 엔드포인트"
    Value: !GetAtt Neo4jInfraStack.Outputs.BoltEndpoint

  Neo4jConnectionString:
    Description: "Neo4j 접속 예시 (비밀번호는 Parameter Store에서 확인: /skn18/neo4j-password)"
    Value: !GetAtt Neo4jInfraStack.Outputs.ConnectionStringExample

  # App Infrastructure Outputs
  AppInstanceId:
    Description: "App EC2 Instance ID (Django + Graph + RAG)"
    Value: !GetAtt AppInfraStack.Outputs.InstanceId

  AppPublicIp:
    Description: "App EC2 Public IP"
    Value: !GetAtt AppInfraStack.Outputs.PublicIp

  AlbDnsName:
    Description: "ALB DNS Name"
    Value: !GetAtt AppInfraStack.Outputs.AlbDnsName

  AlbTargetGroupArn:
    Description: "ALB Target Group ARN"
    Value: !GetAtt AppInfraStack.Outputs.AlbTargetGroupArn

  EcrRepositoryUri:
    Description: "ECR Repository URI for helixops_web"
    Value: !GetAtt AppInfraStack.Outputs.EcrRepositoryUri

  WebServiceLogGroup:
    Description: "CloudWatch Log Group for web service"
    Value: !GetAtt AppInfraStack.Outputs.WebServiceLogGroup
