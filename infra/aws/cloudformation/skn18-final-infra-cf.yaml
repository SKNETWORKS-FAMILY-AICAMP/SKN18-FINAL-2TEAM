          pip install --upgrade --force-reinstall -r requirements-lambda-protocols.txt -t .

  # =========================
  # Lambda Layer: NLTK
  # =========================
  # NLTK는 이제 requirements-lambda-nih.txt로 설치되므로 Layer 불필요
  # NltkLayer:
  #   Type: AWS::Serverless::LayerVersion
  #   Properties:
  #     LayerName: skn18-nltk-layer
  #     Description: "NLTK package and data files for text processing"
  #     ContentUri: ../lambda_layers/nltk-layer/
  #     CompatibleRuntimes:
  #       - python3.12
  #     CompatibleArchitectures:
  #       - x86_64
  #     RetentionPolicy: Retain
  #   Metadata:
  #     BuildMethod: python3.12
  #     BuildProperties:
  #       BuildCommand: |
  #         pip install -r requirements.txt -t python/
  #         python3 -c "import nltk; nltk.download('punkt', download_dir='python/nltk_data'); nltk.download('punkt_tab', download_dir='python/nltk_data')"

  # =========================
  # Lambda 함수: NIH ETL
  # =========================
  # NIH Ingest Lambda
  NihIngestLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: skn18-nih-ingest
      Runtime: python3.12
      Handler: infra.aws.lambda_functions.trigger_etl.nih.nih_ingest.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: 1024  # Ingest는 메모리 사용량이 적음
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
      CodeUri: ../lambda_build/nih/
      Tags:
        Name: skn18-nih-ingest
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        BuildCommand: |
          # Lambda 기본 제공 패키지 제거 (boto3, botocore, s3transfer)
          rm -rf boto3 botocore s3transfer boto3-*.dist-info botocore-*.dist-info s3transfer-*.dist-info || true
          # 불필요한 패키지 제거
          rm -rf torch transformers sentence_transformers accelerate tokenizers safetensors Django langchain langgraph neo4j || true
          rm -rf .history || true
          # Lambda 전용 패키지 설치
          pip install --upgrade --force-reinstall -r requirements-lambda-nih.txt -t .

  # NIH Cleansing + Chunking Lambda
  NihCleanseChunkLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: skn18-nih-cleanse-chunk
      Runtime: python3.12
      Handler: infra.aws.lambda_functions.trigger_etl.nih.nih_cleanse_chunk.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: 3008  # Cleansing + Chunking은 메모리 사용량이 많음
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          OPENAI_API_KEY: !Ref OpenAiApiKey
      CodeUri: ../lambda_build/nih/
      Tags:
        Name: skn18-nih-cleanse-chunk
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        BuildCommand: |
          # Lambda 기본 제공 패키지 제거 (boto3, botocore, s3transfer)
          rm -rf boto3 botocore s3transfer boto3-*.dist-info botocore-*.dist-info s3transfer-*.dist-info || true
          # 불필요한 패키지 제거
          rm -rf torch transformers sentence_transformers accelerate tokenizers safetensors Django langchain langgraph neo4j || true
          rm -rf .history || true
          # Lambda 전용 패키지 설치
          pip install --upgrade --force-reinstall -r requirements-lambda-nih.txt -t .
          # NLTK 데이터 다운로드 (punkt, punkt_tab) - Cleansing에 필요
          python3 -c "import nltk; nltk.download('punkt', download_dir='nltk_data'); nltk.download('punkt_tab', download_dir='nltk_data')" || true

  # =========================
  # EventBridge 규칙: Protocols (키워드별)
  # =========================
  # Protein 키워드 스케줄
  ProtocolsEtlScheduleRuleProtein:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-protocols-etl-protein-schedule
      Description: "Protocols ETL 실행 스케줄 - Protein 키워드"
      ScheduleExpression: "rate(1 day)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsEtlLambdaProtein.Arn
          Id: "ProtocolsProteinTarget"
          Input: !Sub |
            {
              "keyword": "Protein",
              "raw_dir": "data/raw"
            }

  # Cell 키워드 스케줄
  ProtocolsEtlScheduleRuleCell:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-protocols-etl-cell-schedule
      Description: "Protocols ETL 실행 스케줄 - Cell 키워드"
      ScheduleExpression: "rate(1 day)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsEtlLambdaCell.Arn
          Id: "ProtocolsCellTarget"
          Input: !Sub |
            {
              "keyword": "Cell",
              "raw_dir": "data/raw"
            }

  # DNA 키워드 스케줄
  ProtocolsEtlScheduleRuleDna:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-protocols-etl-dna-schedule
      Description: "Protocols ETL 실행 스케줄 - DNA 키워드"
      ScheduleExpression: "rate(1 day)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsEtlLambdaDna.Arn
          Id: "ProtocolsDnaTarget"
          Input: !Sub |
            {
              "keyword": "DNA",
              "raw_dir": "data/raw"
            }

  # RNA 키워드 스케줄
  ProtocolsEtlScheduleRuleRna:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-protocols-etl-rna-schedule
      Description: "Protocols ETL 실행 스케줄 - RNA 키워드"
      ScheduleExpression: "rate(1 day)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsEtlLambdaRna.Arn
          Id: "ProtocolsRnaTarget"
          Input: !Sub |
            {
              "keyword": "RNA",
              "raw_dir": "data/raw"
            }

  # vivo 키워드 스케줄
  ProtocolsEtlScheduleRuleVivo:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-protocols-etl-vivo-schedule
      Description: "Protocols ETL 실행 스케줄 - vivo 키워드"
      ScheduleExpression: "rate(1 day)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsEtlLambdaVivo.Arn
          Id: "ProtocolsVivoTarget"
          Input: !Sub |
            {
              "keyword": "vivo",
              "raw_dir": "data/raw"
            }

  # mouse 키워드 스케줄
  ProtocolsEtlScheduleRuleMouse:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-protocols-etl-mouse-schedule
      Description: "Protocols ETL 실행 스케줄 - mouse 키워드"
      ScheduleExpression: "rate(1 day)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProtocolsEtlLambdaMouse.Arn
          Id: "ProtocolsMouseTarget"
          Input: !Sub |
            {
              "keyword": "mouse",
              "raw_dir": "data/raw"
            }

  # =========================
  # EventBridge 규칙: NIH
  # =========================
  # NIH Ingest 스케줄 (하루에 한 번)
  NihIngestScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-nih-ingest-schedule
      Description: "NIH Ingest 실행 스케줄 - 하루에 한 번"
      ScheduleExpression: "rate(1 day)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt NihIngestLambda.Arn
          Id: "NihIngestTarget"
          Input: !Sub |
            {
              "raw_dir": "data/raw",
              "s3_raw_prefix": "data/raw/nih"
            }

  # NIH Cleansing + Chunking 스케줄 (Ingest에서 직접 호출하므로 비활성화)
  NihCleanseChunkScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: skn18-nih-cleanse-chunk-schedule
      Description: "NIH Cleansing + Chunking 실행 스케줄 - Ingest에서 직접 호출하므로 비활성화"
      ScheduleExpression: "rate(1 day)"
      State: DISABLED  # 비활성화
      Targets:
        - Arn: !GetAtt NihCleanseChunkLambda.Arn
          Id: "NihCleanseChunkTarget"
          Input: !Sub |
            {
              "raw_dir": "data/raw",
              "processed_dir": "data/processed",
              "s3_raw_prefix": "data/raw/nih",
              "s3_processed_prefix": "data/processed/nih"
            }

  # =========================
  # Lambda 권한: EventBridge에서 Lambda 호출 허용
  # =========================
  # Protocols 키워드별 권한
  ProtocolsLambdaPermissionProtein:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsEtlLambdaProtein
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  ProtocolsLambdaPermissionCell:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsEtlLambdaCell
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  ProtocolsLambdaPermissionDna:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsEtlLambdaDna
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  ProtocolsLambdaPermissionRna:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsEtlLambdaRna
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  ProtocolsLambdaPermissionVivo:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsEtlLambdaVivo
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  ProtocolsLambdaPermissionMouse:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtocolsEtlLambdaMouse
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  # NIH Lambda 권한
  NihIngestLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NihIngestLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

  NihCleanseChunkLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NihCleanseChunkLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com

Outputs:
  InstanceId:
    Description: "EC2 Instance ID"
    Value: !Ref PgVectorInstance

  PublicIp:
    Description: "EC2 Public IP"
    Value: !GetAtt PgVectorInstance.PublicIp

  DbEndpoint:
    Description: "DB 접속 엔드포인트 (host:port)"
    Value: !Sub "${PgVectorInstance.PublicIp}:${PostgresPort}"

  ConnectionStringExample:
    Description: "psql 접속 예시"
    Value: !Sub "psql postgresql://${PostgresUser}:${PostgresPassword}@${PgVectorInstance.PublicIp}:${PostgresPort}/${PostgresDbName}"

  DatabaseUrl:
    Description: "DATABASE_URL (애플리케이션에서 바로 사용 가능)"
    Value: !Sub "postgresql://${PostgresUser}:${PostgresPassword}@${PgVectorInstance.PublicIp}:${PostgresPort}/${PostgresDbName}"

  VpcId:
    Description: "생성된 VPC ID"
    Value: !Ref AppVPC

  SubnetId:
    Description: "생성된 Public Subnet ID"
    Value: !Ref AppPublicSubnet

  EtlDataBucketName:
    Description: "ETL 데이터 저장용 S3 버킷 이름"
    Value: !Ref S3BucketName

  ProtocolsLambdaArnProtein:
    Description: "Protocols ETL Lambda 함수 ARN (Protein)"
    Value: !GetAtt ProtocolsEtlLambdaProtein.Arn

  ProtocolsLambdaArnCell:
    Description: "Protocols ETL Lambda 함수 ARN (Cell)"
    Value: !GetAtt ProtocolsEtlLambdaCell.Arn

  ProtocolsLambdaArnDna:
    Description: "Protocols ETL Lambda 함수 ARN (DNA)"
    Value: !GetAtt ProtocolsEtlLambdaDna.Arn

  ProtocolsLambdaArnRna:
    Description: "Protocols ETL Lambda 함수 ARN (RNA)"
    Value: !GetAtt ProtocolsEtlLambdaRna.Arn

  ProtocolsLambdaArnVivo:
    Description: "Protocols ETL Lambda 함수 ARN (vivo)"
    Value: !GetAtt ProtocolsEtlLambdaVivo.Arn

  ProtocolsLambdaArnMouse:
    Description: "Protocols ETL Lambda 함수 ARN (mouse)"
    Value: !GetAtt ProtocolsEtlLambdaMouse.Arn

  NihIngestLambdaArn:
    Description: "NIH Ingest Lambda 함수 ARN"
    Value: !GetAtt NihIngestLambda.Arn

  NihCleanseChunkLambdaArn:
    Description: "NIH Cleansing + Chunking Lambda 함수 ARN"
    Value: !GetAtt NihCleanseChunkLambda.Arn
