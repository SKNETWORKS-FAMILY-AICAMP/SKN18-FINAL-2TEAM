{% load static %}
<div class="modal-overlay" id="tableModal" role="dialog" aria-labelledby="tableModalTitle" aria-modal="true">
    <div class="modal-container modal-large">
        <div class="modal-header">
            <div>
                <h2 class="modal-title" id="tableModalTitle">표 만들기</h2>
                <p class="modal-subtitle">표의 크기를 설정하고 데이터를 입력하세요</p>
            </div>
            <button class="modal-close-btn" aria-label="닫기" data-action="close">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
        
        <div class="modal-body">
            <!-- Table Size Selection -->
            <div class="table-size-section">
                <h3 class="section-title">표 크기 설정</h3>
                <div class="table-size-inputs">
                    <div class="size-input-group">
                        <label for="tableRows" class="size-label">행 (Rows)</label>
                        <sl-input 
                            type="number" 
                            id="tableRows" 
                            min="1" 
                            max="20" 
                            value="3"
                            class="size-input"
                        ></sl-input>
                    </div>
                    <div class="size-input-group">
                        <label for="tableCols" class="size-label">열 (Columns)</label>
                        <sl-input 
                            type="number" 
                            id="tableCols" 
                            min="1" 
                            max="20" 
                            value="3"
                            class="size-input"
                        ></sl-input>
                    </div>
                </div>
            </div>

            <!-- Table Data Input -->
            <div class="table-data-section" id="tableDataSection" style="display: none;">
                <h3 class="section-title">데이터 입력</h3>
                <div class="table-wrapper">
                    <table class="data-table" id="dataTable">
                        <tbody id="tableBody">
                            <!-- Table cells will be dynamically generated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="modal-footer">
            <button class="modal-btn modal-btn-secondary" data-action="close">취소</button>
            <button class="modal-btn modal-btn-primary" data-action="attach" id="attachTableBtn">
                첨부하기
            </button>
        </div>
    </div>
</div>
