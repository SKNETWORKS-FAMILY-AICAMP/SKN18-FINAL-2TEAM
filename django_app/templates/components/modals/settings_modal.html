{% load static %}
<div class="modal-overlay" id="settingsModal" role="dialog" aria-labelledby="settingsModalTitle" aria-modal="true">
    <div class="modal-container modal-medium">
        <div class="modal-header">
            <h2 class="modal-title" id="settingsModalTitle">Settings</h2>
            <button class="modal-close-btn" aria-label="닫기">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
        
        <div class="modal-body">
            <div class="settings-section">
                <h3 class="settings-section-title">일반 설정</h3>
                
                <div class="settings-item">
                    <div class="settings-item-content">
                        <p class="settings-label">알림</p>
                        <p class="settings-description">시스템 알림 활성화</p>
                    </div>
                    <label class="toggle-switch-wrapper">
                        <input 
                            type="checkbox" 
                            id="notificationsToggle"
                            class="toggle-switch-input"
                            checked
                        />
                        <span class="toggle-switch"></span>
                    </label>
                </div>
                
                <div class="settings-item">
                    <div class="settings-item-content">
                        <p class="settings-label">이메일 알림</p>
                        <p class="settings-description">중요 업데이트 이메일 수신</p>
                    </div>
                    <label class="toggle-switch-wrapper">
                        <input 
                            type="checkbox" 
                            id="emailAlertsToggle"
                            class="toggle-switch-input"
                            checked
                        />
                        <span class="toggle-switch"></span>
                    </label>
                </div>
                
                <div class="settings-item">
                    <div class="settings-item-content">
                        <p class="settings-label">자동 저장</p>
                        <p class="settings-description">노트 자동 저장</p>
                    </div>
                    <label class="toggle-switch-wrapper">
                        <input 
                            type="checkbox" 
                            id="autoSaveToggle"
                            class="toggle-switch-input"
                            checked
                        />
                        <span class="toggle-switch"></span>
                    </label>
                </div>
            </div>
            
            <div class="settings-language-wrapper">
                <label class="settings-language-label" for="languageSelect">언어</label>
                <select id="languageSelect" class="settings-select">
                    <option value="ko" selected>한국어</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                </select>
            </div>
        </div>
        
        <div class="modal-footer">
            <button class="modal-btn modal-btn-secondary" data-action="close">취소</button>
            <button class="modal-btn modal-btn-primary" data-action="save" id="saveSettingsBtn">
                저장
            </button>
        </div>
    </div>
</div>
