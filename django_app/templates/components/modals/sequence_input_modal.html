{% load static %}
<div class="modal-overlay" id="sequenceInputModal" role="dialog" aria-labelledby="sequenceInputModalTitle" aria-modal="true">
    <div class="modal-container modal-medium">
        <div class="modal-header">
            <div>
                <h2 class="modal-title" id="sequenceInputModalTitle">단백질 서열 입력</h2>
                <p class="modal-subtitle">사용할 단백질 서열을 붙여넣으세요</p>
            </div>
            <button class="modal-close-btn" aria-label="닫기">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
        
        <div class="modal-body">
            <div class="form-group">
                <label for="sequenceInputTextarea">단백질 서열</label>
                <textarea
                    id="sequenceInputTextarea"
                    placeholder="단백질 서열을 붙여넣으세요 (예: MEEPQSDPSVEPPLSQETFSDLWKLLPENNVLSPLPSQAMDDLMLSPDDIEQWFTEDPGP...)"
                    class="form-textarea sequence-textarea"
                    rows="12"
                ></textarea>
                <p class="form-help-text" id="sequenceInputCharCount">서열을 입력하세요</p>
            </div>

            <div class="sequence-input-info" id="sequenceInputInfo" style="display: none;">
                <i class="fa-solid fa-info-circle"></i>
                <p>입력된 서열이 실험 파이프라인에 적용됩니다</p>
            </div>
        </div>
        
        <div class="modal-footer">
            <button class="modal-btn modal-btn-secondary" data-action="close">취소</button>
            <button class="modal-btn modal-btn-primary" id="sequenceInputApplyBtn" disabled>
                <i class="fa-solid fa-check-circle"></i>
                적용
            </button>
        </div>
    </div>
</div>
