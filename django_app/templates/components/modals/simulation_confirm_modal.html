{% load static %}
<div class="modal-overlay" id="simulationConfirmModal" role="dialog" aria-labelledby="simulationConfirmModalTitle" aria-modal="true">
    <div class="modal-container modal-medium">
        <div class="modal-header">
            <div>
                <h2 class="modal-title" id="simulationConfirmModalTitle">시뮬레이션 확인</h2>
                <p class="modal-subtitle">선택한 도구로 시뮬레이션을 실행할까요?</p>
            </div>
            <button class="modal-close-btn" aria-label="닫기">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
        
        <div class="modal-body">
            <div class="simulation-modal-content">
                <!-- Simulation Title Input -->
                <div class="simulation-form-field">
                    <label for="simulationTitleInput" class="simulation-label">시뮬레이션 타이틀</label>
                    <input
                        type="text"
                        id="simulationTitleInput"
                        placeholder="시뮬레이션 이름을 입력하세요"
                        class="simulation-title-input"
                    />
                </div>

                <!-- Protein Sequence Display -->
                <div class="simulation-form-field" id="simulationProteinSequenceContainer" style="display: none;">
                    <label class="simulation-label">단백질 서열</label>
                    <div class="simulation-sequence-preview" id="simulationProteinSequence">
                        <!-- Sequence will be displayed here -->
                    </div>
                </div>

                <!-- Selected Tools -->
                <div class="simulation-form-field">
                    <h3 class="simulation-tools-title">선택된 도구</h3>
                    <div class="simulation-selected-tools-list" id="simulationSelectedToolsList">
                        <!-- Selected tools will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
        
        <div class="modal-footer">
            <button class="modal-btn modal-btn-secondary" data-action="close">취소</button>
            <button class="modal-btn modal-btn-primary" id="simulationConfirmRunBtn">
                <i class="fa-solid fa-play"></i>
                시뮬레이션 실행
            </button>
        </div>
    </div>
</div>
