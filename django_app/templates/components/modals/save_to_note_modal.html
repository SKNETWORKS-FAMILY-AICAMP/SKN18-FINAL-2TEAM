{% load static %}
<div class="modal-overlay" id="saveToNoteModal" role="dialog" aria-labelledby="saveToNoteModalTitle" aria-modal="true">
    <div class="modal-container modal-medium">
        <div class="modal-header">
            <div>
                <h2 class="modal-title" id="saveToNoteModalTitle">노트에 저장</h2>
                <p class="modal-subtitle" id="saveToNoteModalDescription">이 답변을 노트에 저장합니다</p>
            </div>
            <button class="modal-close-btn" aria-label="닫기" data-action="close">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
        
        <div class="modal-body">
            <!-- Shoelace Tab Group -->
            <sl-tab-group id="saveToNoteTabGroup" class="save-note-tabs">
                <sl-tab slot="nav" panel="existing" active>기존 노트에 추가</sl-tab>
                <sl-tab slot="nav" panel="new">신규 노트로 만들기</sl-tab>
                
                <!-- Existing Note Panel -->
                <sl-tab-panel name="existing">
                    <div class="tab-panel-content">
                        <!-- Search Bar -->
                        <div class="search-box">
                            <div class="search-input-wrapper">
                                <input 
                                    type="text" 
                                    id="noteSearchInput"
                                    placeholder="노트 제목 또는 카테고리 검색..." 
                                    class="search-input"
                                />
                                <i class="fa-solid fa-search search-icon"></i>
                            </div>
                        </div>
                        
                        <!-- Notes List -->
                        <div class="notes-list" id="notesList">
                            <!-- Notes will be loaded here -->
                        </div>
                        
                        <!-- Pagination -->
                        <div class="pagination" id="notesPagination">
                            <!-- Pagination will be rendered here -->
                        </div>
                    </div>
                </sl-tab-panel>
                
                <!-- New Note Panel -->
                <sl-tab-panel name="new">
                    <div class="tab-panel-content">
                        <div class="form-group">
                            <label for="newNoteName" class="form-label">노트 제목</label>
                            <input 
                                type="text" 
                                id="newNoteName"
                                placeholder="새 노트의 제목을 입력하세요" 
                                class="form-input"
                            />
                        </div>
                    </div>
                </sl-tab-panel>
            </sl-tab-group>
        </div>
        
        <div class="modal-footer">
            <button class="modal-btn modal-btn-secondary" data-action="close">취소</button>
            <button class="modal-btn modal-btn-primary" data-action="save" id="saveNoteBtn" disabled>저장</button>
        </div>
    </div>
</div>
