{% load static %}
<div class="modal-overlay" id="molstarModal" role="dialog" aria-labelledby="molstarModalTitle" aria-modal="true">
    <div class="modal-container modal-xlarge">
        <div class="modal-header">
            <div>
                <h2 class="modal-title" id="molstarModalTitle">3D 구조 뷰어</h2>
            </div>
            <button class="modal-close-btn" aria-label="닫기" data-action="close" id="molstarModalCloseBtn">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
        
        <div class="modal-body">
            <!-- Molstar Viewer Container -->
            <div id="molstar-viewer-container">
                <div id="molstar-viewer"></div>
            </div>
        </div>
    </div>
</div>

<!-- Save State Confirmation Modal -->
<div class="modal-overlay" id="molstarSaveStateModal" role="dialog" aria-modal="true" style="display: none;">
    <div class="modal-container modal-medium">
        <div class="modal-header">
            <div>
                <h2 class="modal-title">작업 상태 저장</h2>
                <p class="modal-subtitle">현재 뷰어 상태를 저장하시겠습니까?</p>
            </div>
            <button class="modal-close-btn" aria-label="닫기" data-action="close-save-modal">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
        
        <div class="modal-body">
            <div style="padding: 1rem;">
                <label for="viewerStateName" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">
                    상태 이름 (선택사항)
                </label>
                <input 
                    type="text" 
                    id="viewerStateName" 
                    placeholder="예: 초기 구조 비교"
                    style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem;"
                />
            </div>
        </div>
        
        <div class="modal-footer">
            <div style="display: flex; gap: 0.5rem; justify-content: flex-end; width: 100%;">
                <button class="modal-btn modal-btn-secondary" id="closeWithoutSaveBtn">저장하지 않고 닫기</button>
                <button class="modal-btn modal-btn-primary" id="confirmSaveStateBtn">저장</button>
            </div>
        </div>
    </div>
</div>
