name: SKN18-final-prod

# 주의: 이 docker-compose.prod.yml은 App EC2에서 실행됩니다.
# PostgreSQL, Neo4j, RabbitMQ는 외부 EC2 인스턴스를 사용합니다.
# 모든 설정은 Parameter Store에서 entrypoint.sh가 자동으로 읽어옵니다.

services:
  ########################################
  # 2) Django + LangGraph Web (SSR + API)
  ########################################
  web:
    # CI/CD에서 ECR에 푸시한 이미지 사용
    # ex) 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/helixops_web:latest
    image: ${ECR_WEB_IMAGE:-helixops_web:latest}
    container_name: web-app
    # env_file 제거 - Parameter Store에서 모든 설정을 읽어옴
    # db, neo4j, rabbitmq는 외부 EC2를 사용하므로 depends_on 제거
    environment:
      # 모든 설정은 GitHub Actions 배포 시 Parameter Store에서 읽어서 환경변수로 주입됨
      # .env 파일 없이 SSM만으로 배포 (방식 A)
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      STACK_NAME: ${STACK_NAME:-skn18-final-infra}
      # PostgreSQL 설정 (SSM에서 주입)
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # Neo4j 설정 (SSM에서 주입)
      NEO4J_BOLT_HOST: ${NEO4J_BOLT_HOST}
      NEO4J_BOLT_PORT: ${NEO4J_BOLT_PORT:-7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # RabbitMQ 설정 (SSM에서 주입)
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Django 설정 (SSM에서 주입, 옵션)
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # RunPod 설정 (SSM에서 주입)
      RUNPOD_SIMS_BASE_URL: ${RUNPOD_SIMS_BASE_URL}
      RUNPOD_SIMS_API_KEY: ${RUNPOD_SIMS_API_KEY}
    # Entrypoint가 마이그레이션을 실행한 후 CMD 실행
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120
      --access-logfile -
      --error-logfile -
      --log-level info
      --preload
      --keep-alive 5
    # Docker 헬스체크: 컨테이너가 준비되었는지 빠르게 확인
    # Python을 사용하여 헬스체크 (curl 없이도 동작)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s  # 컨테이너 시작 후 30초 동안 헬스체크 실패 허용
    # CloudWatch 로그 드라이버 사용 (AWS 환경에서만 동작)
    # 주의: 로그 그룹이 미리 생성되어 있어야 함 (배포 스크립트에서 자동 생성)
    # 로그 그룹이 없으면 기본 로깅(json-file) 사용하려면 아래 주석 처리
    logging:
      driver: awslogs
      options:
        awslogs-group: /ec2/skn18/web-service
        awslogs-region: ap-northeast-2
        # awslogs-create-group: "true"  # Docker Compose에서는 지원하지 않으므로 배포 스크립트에서 생성
    ports:
      # ALB를 통해 접근하므로 내부용으로만 사용
      - "8000:8000"
    volumes:
      # 모델 파일 영구 저장 (컨테이너 재기동 시에도 유지)
      - /home/ec2-user/models:/app/models
    restart: unless-stopped
    network_mode: bridge

  ########################################
  # 3) Worker (RabbitMQ Consumer / 시뮬레이션 작업 처리)
  ########################################
  worker:
    # CI/CD에서 따로 빌드한 worker 이미지
    image: ${ECR_WORKER_IMAGE:-skn18-final-worker:latest}
    container_name: rabbitmq-worker
    # env_file 제거 - Parameter Store에서 모든 설정을 읽어옴
    # db와 rabbitmq는 외부 EC2를 사용하므로 depends_on 제거
    environment:
      # RabbitMQ 연결 정보는 entrypoint.sh에서 Parameter Store에서 읽어옴
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      STACK_NAME: ${STACK_NAME:-skn18-final-infra}
      # RunPod 설정 (SSM에서 주입)
      RUNPOD_SIMS_BASE_URL: ${RUNPOD_SIMS_BASE_URL}
      RUNPOD_SIMS_API_KEY: ${RUNPOD_SIMS_API_KEY}
      # RabbitMQ 설정 (SSM에서 주입)
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # PostgreSQL 설정 (Django ORM 사용)
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # Django 설정
      DJANGO_SETTINGS_MODULE: config.settings
    # 시뮬레이션 Consumer 실행
    command: ["python", "-m", "messaging.workers.main"]
    # CloudWatch 로그 드라이버 사용 (AWS 환경에서만 동작)
    # 주의: 로그 그룹이 미리 생성되어 있어야 함 (배포 스크립트에서 자동 생성)
    logging:
      driver: awslogs
      options:
        awslogs-group: /ec2/skn18/worker-service
        awslogs-region: ap-northeast-2
    restart: unless-stopped

  ########################################
  # 4) Celery Worker (알림 및 주기적 작업 처리)
  ########################################
  celery-worker:
    # web 이미지와 동일한 이미지 사용 (Django 앱 포함)
    image: ${ECR_WEB_IMAGE:-helixops_web:latest}
    container_name: celery-worker
    # entrypoint를 사용하여 마이그레이션 자동 실행
    entrypoint: ["/entrypoint.sh"]
    environment:
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      STACK_NAME: ${STACK_NAME:-skn18-final-infra}
      # PostgreSQL 설정 (SSM에서 주입)
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # RabbitMQ 설정 (SSM에서 주입)
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Django 설정
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    working_dir: /app/django_app
    # Celery Worker 실행 - entrypoint.sh가 마이그레이션 후 실행
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    # CloudWatch 로그 드라이버 사용 (AWS 환경에서만 동작)
    # 주의: 로그 그룹이 미리 생성되어 있어야 함 (배포 스크립트에서 자동 생성)
    logging:
      driver: awslogs
      options:
        awslogs-group: /ec2/skn18/celery-worker-service
        awslogs-region: ap-northeast-2
    restart: unless-stopped

  ########################################
  # 5) Celery Beat (스케줄러 - 일정 리마인더 등)
  ########################################
  celery-beat:
    # web 이미지와 동일한 이미지 사용 (Django 앱 포함)
    image: ${ECR_WEB_IMAGE:-helixops_web:latest}
    container_name: celery-beat
    # entrypoint를 사용하여 마이그레이션 자동 실행
    entrypoint: ["/entrypoint.sh"]
    environment:
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      STACK_NAME: ${STACK_NAME:-skn18-final-infra}
      # PostgreSQL 설정 (SSM에서 주입)
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # RabbitMQ 설정 (SSM에서 주입)
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Django 설정
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    working_dir: /app/django_app
    # Celery Beat 실행 (스케줄러) - entrypoint.sh가 마이그레이션 후 실행
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    # CloudWatch 로그 드라이버 사용 (AWS 환경에서만 동작)
    # 주의: 로그 그룹이 미리 생성되어 있어야 함 (배포 스크립트에서 자동 생성)
    logging:
      driver: awslogs
      options:
        awslogs-group: /ec2/skn18/celery-beat-service
        awslogs-region: ap-northeast-2
    restart: unless-stopped

  ########################################
  # 4) sLLM 서버 (옵션: vLLM/Ollama 등)
  ########################################
  sllm-server:
    # 로컬 sLLM 서버를 ECR에 올린 경우 사용
    image: ${ECR_SLLM_IMAGE:-skn18-final-sllm-server:latest}
    container_name: sllm-server
    # env_file 제거
    environment:
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    ports:
      - "8001:8001"
    restart: unless-stopped
    # GPU가 필요한 경우 EC2 + compose에서 runtime/nvidia 설정 필요
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: ["gpu"]

  ########################################
  # 5) Nginx (옵션: 프록시/도메인 붙일 때)
  ########################################
  nginx:
    image: nginx:1.27-alpine
    container_name: skn18-nginx
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

# volumes:
# RabbitMQ는 외부 EC2에서 실행되므로 볼륨이 필요 없음
# (필요시 위 주석을 해제하고 볼륨 정의 추가)
