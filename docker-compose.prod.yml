name: SKN18-final-prod

# 주의: 이 docker-compose.prod.yml은 App EC2에서 실행됩니다.
# PostgreSQL과 Neo4j는 외부 EC2 인스턴스를 사용합니다.
# .env 파일에서 POSTGRES_HOST와 NEO4J_HOST를 외부 EC2 IP로 설정하세요.

services:
  ########################################
  # 1) RabbitMQ (Message Queue)
  ########################################
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-final
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"      # AMQP 포트
      - "15672:15672"    # Management UI (운영 모니터링용)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ########################################
  # 2) Django + LangGraph Web (SSR + API)
  ########################################
  web:
    # CI/CD에서 ECR에 푸시한 이미지 사용
    # ex) 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/helixops_web:latest
    image: ${ECR_WEB_IMAGE:-helixops_web:latest}
    container_name: web-app
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      # db와 neo4j는 외부 EC2를 사용하므로 depends_on 제거
    environment:
      # RabbitMQ 연결 정보
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    # Entrypoint가 마이그레이션을 실행한 후 CMD 실행
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --access-logfile -
      --error-logfile -
      --log-level info
    # CloudWatch 로그 드라이버 사용 (AWS 환경에서만 동작)
    logging:
      driver: awslogs
      options:
        awslogs-group: /ec2/skn18/web-service
        awslogs-region: ap-northeast-2
        awslogs-stream-prefix: web-app
    ports:
      # ALB를 통해 접근하므로 내부용으로만 사용
      - "8000:8000"
    restart: unless-stopped
    network_mode: bridge

  ########################################
  # 3) Worker (ETL / 배치 / Consumer)
  ########################################
  worker:
    # CI/CD에서 따로 빌드한 worker 이미지
    image: ${ECR_WORKER_IMAGE:-skn18-final-worker:latest}
    container_name: etl-worker
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      # db는 외부 EC2를 사용하므로 depends_on 제거
    environment:
      # RabbitMQ 연결 정보
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    # 시뮬레이션 Consumer 실행
    command: ["python", "-m", "messaging.workers.main"]
    restart: unless-stopped

  ########################################
  # 4) sLLM 서버 (옵션: vLLM/Ollama 등)
  ########################################
  sllm-server:
    # 로컬 sLLM 서버를 ECR에 올린 경우 사용
    image: ${ECR_SLLM_IMAGE:-skn18-final-sllm-server:latest}
    container_name: sllm-server
    env_file:
      - .env
    ports:
      - "8001:8001"
    restart: unless-stopped
    # GPU가 필요한 경우 EC2 + compose에서 runtime/nvidia 설정 필요
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: ["gpu"]

  ########################################
  # 5) Nginx (옵션: 프록시/도메인 붙일 때)
  ########################################
  nginx:
    image: nginx:1.27-alpine
    container_name: skn18-nginx
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  rabbitmq-data:        # RabbitMQ 데이터 영속성
  rabbitmq-logs:        # RabbitMQ 로그
