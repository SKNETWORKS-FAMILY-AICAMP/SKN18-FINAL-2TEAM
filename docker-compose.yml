name: SKN18-final

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pg-db-final
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sknfinaldb}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root1234}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-sknfinaldb} -U ${POSTGRES_USER:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15.0
    container_name: neo4j-final
    environment:
      - NEO4J_AUTH=neo4j/neo4jpass
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./infra/neo4j/neo4j.conf:/config/neo4j.conf
      - ./infra/neo4j/init.cypher:/docker-entrypoint-initdb.d/init.cypher
      - ./infra/neo4j/plugins:/plugins
      - ./infra/neo4j/import:/import
    restart: unless-stopped

volumes:
  pgvector-data:
  neo4j-data:
  neo4j-logs:
