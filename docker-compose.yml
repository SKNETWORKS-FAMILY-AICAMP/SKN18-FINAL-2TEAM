name: SKN18-final

services:
  db:
    image: pgvector/pgvector:pg18
    container_name: pg-db-final
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sknfinaldb}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root1234}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ 호환: /var/lib/postgresql에 마운트하면
      # 자동으로 버전별 디렉토리(예: /var/lib/postgresql/18)를 생성합니다
      - pgvector-data:/var/lib/postgresql
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-sknfinaldb} -U ${POSTGRES_USER:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # worker:  # ETL / 배치 / RAG 인덱싱
  #   build:
  #     context: .
  #     dockerfile: ./infra/docker/Dockerfile.worker
  #   container_name: etl-worker
  #   env_file:
  #     - .env
  #   depends_on:
  #     - db
  #   restart: unless-stopped
  #   command: ["python", "-m", "jobs.manage_etl"]
    # 필요 시 다른 커맨드로 교체 (Celery, cron용 스크립트 등)

  neo4j:
    image: neo4j:5.15.0
    container_name: neo4j-final
    environment:
      - NEO4J_AUTH=neo4j/neo4jpass
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./infra/neo4j/neo4j.conf:/config/neo4j.conf
      - ./infra/neo4j/init.cypher:/docker-entrypoint-initdb.d/init.cypher
      - ./infra/neo4j/plugins:/plugins
      - ./infra/neo4j/import:/import
    restart: unless-stopped

  ########################################
  # RabbitMQ (Message Queue)
  ########################################
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-final
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"      # AMQP 포트
      - "15672:15672"    # Management UI (개발 모니터링용)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ########################################
  # Celery Worker (로컬 개발용 - 선택사항)
  ########################################
  celery-worker:
    build:
      context: .
      dockerfile: ./infra/docker/Dockerfile.django
    container_name: celery-worker-local
    entrypoint: []  # Dockerfile의 ENTRYPOINT 오버라이드
    environment:
      POSTGRES_HOST: db  # Docker Compose 서비스 이름 사용
      POSTGRES_DB: sknfinaldb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root1234
      POSTGRES_PORT: 5432
      RABBITMQ_HOST: rabbitmq  # Docker Compose 서비스 이름 사용
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-me}
    working_dir: /app/django_app
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      - db
      - rabbitmq
    volumes:
      - ./django_app:/app/django_app
      - ./graph:/app/graph
      - ./rag:/app/rag
      - ./kg:/app/kg
      - ./messaging:/app/messaging
    restart: unless-stopped

  ########################################
  # Celery Beat (로컬 개발용 - 일정 리마인더)
  ########################################
  celery-beat:
    build:
      context: .
      dockerfile: ./infra/docker/Dockerfile.django
    container_name: celery-beat-local
    entrypoint: []  # Dockerfile의 ENTRYPOINT 오버라이드
    environment:
      POSTGRES_HOST: db  # Docker Compose 서비스 이름 사용
      POSTGRES_DB: sknfinaldb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root1234
      POSTGRES_PORT: 5432
      RABBITMQ_HOST: rabbitmq  # Docker Compose 서비스 이름 사용
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-me}
    working_dir: /app/django_app
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    depends_on:
      - db
      - rabbitmq
      - celery-worker
    volumes:
      - ./django_app:/app/django_app
      - ./graph:/app/graph
      - ./rag:/app/rag
      - ./kg:/app/kg
      - ./messaging:/app/messaging
    restart: unless-stopped

volumes:
  pgvector-data:
  neo4j-data:
  neo4j-logs:
  rabbitmq-data:        # RabbitMQ 데이터 영속성
  rabbitmq-logs:        # RabbitMQ 로그